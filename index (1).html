  // Window creator
  function createWindow(title, contentHTML) {
    const win = document.createElement("div");
    win.className = "window";
    win.style.top = "60px";
    win.style.left = "60px";

    win.innerHTML = `
      <div class="titlebar">
        <span>${title}</span>
        <div class="closeBtn">X</div>
      </div>
      ${contentHTML}
    `;

    document.body.appendChild(win);

    win.querySelector(".closeBtn").onclick = () => win.remove();

    const bar = win.querySelector(".titlebar");
    let offsetX, offsetY;

    bar.onmousedown = (e) => {
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;

      document.onmousemove = (e) => {
        win.style.left = (e.clientX - offsetX) + "px";
        win.style.top = (e.clientY - offsetY) + "px";
      };

      document.onmouseup = () => {
        document.onmousemove = null;
      };
    };

    return win;
  }

  // Notepad
  function openNotepad() {
    const win = createWindow("Notepad", `
      <textarea class="notepadArea" id="notepadArea"></textarea>
    `);

    const area = win.querySelector("#notepadArea");
    area.value = localStorage.getItem("taco_notepad") || "";
    area.addEventListener("input", () => {
      localStorage.setItem("taco_notepad", area.value);
    });
  }

  // Paint
  function openPaint() {
    const win = createWindow("Paint", `
      <canvas id="paintCanvas"></canvas>
    `);

    const canvas = win.querySelector("#paintCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    let drawing = false;

    canvas.onmousedown = () => drawing = true;
    canvas.onmouseup = () => drawing = false;
    canvas.onmouseleave = () => drawing = false;
    canvas.onmousemove = (e) => {
      if (!drawing) return;
      ctx.fillRect(e.offsetX, e.offsetY, 4, 4);
    };
  }
function openCalculator() {
  const htmlContent = `

  // Create window with custom size
  const win = createWindow("Calculator", htmlContent);
  
  // Override window size
  win.style.width = "280px"; // smaller width
  win.style.height = "300px"; // smaller height
  
  // Attach event handlers as before...
  const calcInput = win.querySelector('#calcResult');

  win.querySelectorAll('.calcButton').forEach(btn => {
    const val = btn.getAttribute('data-value');

  // TACO PEDIA INIT
  function initTacoPedia(root) {
    const home = root.querySelector("#home");
    const resultsScreen = root.querySelector("#results-screen");
    const articleScreen = root.querySelector("#article-screen");

    const resultsEl = root.querySelector("#results");
    const articleTitle = root.querySelector("#article-title");
    const articleText = root.querySelector("#article-text");

    const topTabs = root.querySelector("#top-tabs");

    let openTabs = [];

    function renderTabs() {
      topTabs.innerHTML = openTabs.map((t, i) => `
        <div class="tab ${t.active ? "active" : ""}" data-id="${i}">
          ${t.title}
          <span class="close-tab" data-close="${i}">✕</span>
        </div>
      `).join("");

      topTabs.style.display = openTabs.length > 0 ? "flex" : "none";

      topTabs.querySelectorAll(".tab").forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute("data-id");
          setActiveTab(id);
          openArticle(openTabs[id]);
        };
      });

      topTabs.querySelectorAll(".close-tab").forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const id = el.getAttribute("data-close");
          openTabs.splice(id, 1);
          renderTabs();
        };
      });
    }

    function setActiveTab(id) {
      openTabs.forEach((t, i) => t.active = (i == id));
      renderTabs();
    }

    function addTab(item) {
      const existing = openTabs.findIndex(t => t.title === item.title);

      if (existing !== -1) {
        setActiveTab(existing);
        openArticle(openTabs[existing]);
        return;
      }

      openTabs.push({ ...item, active: true });
      renderTabs();
    }

    root.querySelector("#search-form").addEventListener("submit", (e) => {
      e.preventDefault();

      const q = root.querySelector("#search-input").value.toLowerCase().trim();

      const matches = DATA.filter(entry => {
        const text = `${entry.title} ${entry.summary} ${entry.full}`
          .toLowerCase()
          .split(/\W+/);

        return q.split(" ").every(word => text.includes(word));
      });

      home.style.display = "none";
      articleScreen.style.display = "none";
      resultsScreen.style.display = "block";

      resultsEl.innerHTML = matches.length > 0 ? matches.map((item, i) => `
        <div class="result" data-id="${i}">
          <h2>${item.title}</h2>
          <p>${item.summary}</p>
        </div>
      `).join("") : "<p>No results found.</p>";

      resultsEl.querySelectorAll(".result").forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute("data-id");
          addTab(matches[id]);
          openArticle(matches[id]);
        };
      });
    });

    function openArticle(item) {
      home.style.display = "none";
      resultsScreen.style.display = "none";
      articleScreen.style.display = "block";

      articleTitle.textContent = item.title;
      articleText.textContent = item.full;
    }

    root.querySelector("#back-home").onclick = () => {
      resultsScreen.style.display = "none";
      articleScreen.style.display = "none";
      home.style.display = "block";
    };

    root.querySelector("#back-results").onclick = () => {
      articleScreen.style.display = "none";
      resultsScreen.style.display = "block";
    };

    root.addEventListener("contextmenu", e => e.preventDefault());

    root.addEventListener("keydown", e => {
      if (e.ctrlKey && ["c","x","s","u","p","a"].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });
  }

        <label>Change Passcode:</label><br>
        <input type="password" id="newPasscode" placeholder="New Passcode" style="width: 100%; padding: 4px; margin-top: 4px;">
        <button id="setPasscodeBtn" style="margin-top: 8px; padding: 4px 8px;">Set Passcode</button>
      </div>
      <hr>
      <div style="margin-bottom:15px;">
        <label>Upload Background Image:</label><br>
        <input type="file" id="bgUpload" accept="image/*" style="margin-top: 4px;">
        <button id="setBgBtn" style="margin-top: 8px; padding: 4px 8px;">Set Background</button>
      </div>
      <div>
        <h4>Current Background Preview:</h4>
        <div id="bgPreview" style="width: 100%; height: 150px; background: #eee; border: 1px solid #ccc; display:flex; align-items:center; justify-content:center;">
          ${currentBg ? `<img src="${currentBg}" style="max-width:100%; max-height:100%;">` : 'No background set'}
        </div>
      </div>
    </div>
  `;

  const win = createWindow("Settings", htmlContent);

  // Set new passcode
  win.querySelector("#setPasscodeBtn").onclick = () => {
    const newCode = win.querySelector("#newPasscode").value.trim();
    if (newCode) {
      localStorage.setItem('passcode', newCode);
      alert("Passcode updated!");
    } else {
      alert("Enter a valid passcode");
    }
  };

  // Set background image
  win.querySelector("#setBgBtn").onclick = () => {
    const fileInput = win.querySelector("#bgUpload");
    const file = fileInput.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        localStorage.setItem('background', dataUrl);
        document.body.style.background = `url(${dataUrl}) no-repeat center center / cover`;
        // Update preview
        win.querySelector("#bgPreview").innerHTML = `<img src="${dataUrl}" style="max-width:100%; max-height:100%;">`;
      };
      reader.readAsDataURL(file);
    } else {
      alert("Please select an image file");
    }
  };
}

// Apply saved background on page load
window.onload = () => {
  const bg = localStorage.getItem('background');
  if (bg) {
    document.body.style.background = `url(${bg}) no-repeat center center / cover`;
  }
};
// Sign Out button handler
document.getElementById("signOutBtn").onclick = () => {
  showPasscodeOverlay();
};

function showPasscodeOverlay() {
  // Create overlay
  const overlay = document.createElement("div");
  overlay.id = "passcodeOverlay";
  overlay.style.position = "fixed";
  overlay.style.top = 0;
  overlay.style.left = 0;
  overlay.style.width = "100%";
  overlay.style.height = "100%";
  overlay.style.backgroundColor = "black";
  overlay.style.display = "flex";
  overlay.style.justifyContent = "center";
  overlay.style.alignItems = "center";
  overlay.style.zIndex = 9999;

  // Inner box with input and message
  const box = document.createElement("div");
  box.style.color = "white";
  box.style.textAlign = "center";

  const title = document.createElement("div");
  title.innerText = "Passcode";
  title.style.fontSize = "36px";
  title.style.marginBottom = "20px";

  const input = document.createElement("input");
  input.type = "password";
  input.style.fontSize = "24px";
  input.style.padding = "10px";
  input.style.width = "200px";
  input.style.borderRadius = "4px";
  input.style.border = "none";

  const message = document.createElement("div");
  message.innerText = ""; // Will show NOPE message if wrong
  message.style.color = "red";
  message.style.fontSize = "24px";
  message.style.marginTop = "20px";

  // Append elements
  box.appendChild(title);
  box.appendChild(input);
  box.appendChild(message);
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  // Default passcode
  const defaultPasscode = "1234";

  // Handle Enter key
  input.onkeydown = (e) => {
    if (e.key === "Enter") {
      validatePasscode(input.value, message, overlay, defaultPasscode);
    }
  };

  // Handle click outside or focus
  input.focus();

  // Validate function
  function validatePasscode(val, msg, overlayDiv, defaultCode) {
    const storedCode = localStorage.getItem("passcode") || defaultCode;
    if (val === storedCode) {
      // Correct passcode
      overlayDiv.remove();
      alert("Signed out!"); // You can replace this with your sign-out logic
    } else {
      // Wrong code
      msg.innerText = "NOPE NOT THE CODE";
      input.value = "";
    }
  }
}
</script>
